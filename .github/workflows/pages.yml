name: Publish Glam-Cycle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh approved Airtable inventory when configured
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: |
          if [ -n "$AIRTABLE_TOKEN$AIRTABLE_BASE_ID$AIRTABLE_TABLE_ID" ]; then
            python scripts/sync_airtable.py
          else
            echo 'Airtable is not configured. Publishing the original catalog snapshot.'
          fi
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html styles.css app.js config.js _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
